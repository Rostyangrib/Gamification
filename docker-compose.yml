services:
  db:
    image: postgres:16
    container_name: abac_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: abac_backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:1234@db:5432/postgres
      CORS_ORIGINS: http://localhost:5173
      OLLAMA_HOST: http://host.docker.internal:11434
      INIT_DB: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: abac_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      OLLAMA_HOST: http://host.docker.internal:11434
      MAX_AGENT_STEPS: "5"
    stdin_open: true
    tty: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles: ["cli"]

  mcp:
    build: .
    env_file: .env
    command: ["python", "server.py"]
    profiles: ["mcp"]

volumes:
  postgres_data:
